[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = { glob = "*.pxd" } },
  { id = "end-of-file-fixer", exclude = { glob = "*.pxd" } },
  { id = "check-added-large-files", args = ["--maxkb=600"] },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },  # for pyproject.toml and this file
  { id = "check-yaml" }  # for VCR cassettes and GitLab CI
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  { id = "ruff-check" },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.65"
hooks = [
  { id = "ty" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.0"
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/jackdewinter/pymarkdown"
rev = "v0.9.39"
hooks = [
  { id = "pymarkdown" },
]
