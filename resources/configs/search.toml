# Configuration for 'records_all_v1' Algolia search index.
# Intended as a source of truth. Encoded as TOML to allow comments.

attributesForFaceting = [
    "type",
]
paginationLimitedTo = 1000
separatorsToIndex = ""
searchableAttributes = [
    "unordered(name)",
]
ranking = [
    "typo",
    "geo",
    "words",
    "filters",
    "proximity",
    "attribute",
    "exact",
    "custom",
]
highlightPreTag = "<em>"
highlightPostTag = "</em>"
hitsPerPage = 20
minWordSizefor1Typo = 4
minWordSizefor2Typos = 8
queryType = "prefixLast"
removeWordsIfNoResults = "none"
exactOnSingleWordQuery = "attribute"
alternativesAsExact = [
    "ignorePlurals",
    "singleWordSynonym",
]
maxValuesPerFacet = 100
version = 2

[renderingContent.facetOrdering.facets]
order = [
    "type",
]

[renderingContent.facetOrdering.values.type]
sortRemainingBy = "alpha"
