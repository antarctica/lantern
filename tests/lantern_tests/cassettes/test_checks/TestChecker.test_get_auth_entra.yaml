interactions:
- request:
    body: client_id=x&client_secret=x&scope=https%3A%2F%2Fgraph.microsoft.com%2F.default&grant_type=client_credentials
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate, zstd
      Connection:
      - keep-alive
      Content-Length:
      - '182'
      Content-Type:
      - application/x-www-form-urlencoded
      User-Agent:
      - python-requests/2.34.2
    method: POST
    uri: https://login.microsoftonline.com/x/oauth2/v2.0/token
  response:
    body:
      string: '{"token_type":"Bearer","expires_in":3599,"ext_expires_in":3599,"access_token":"x"}'
    headers:
      Cache-Control:
      - no-store, no-cache
      Content-Length:
      - '2117'
      Content-Type:
      - application/json; charset=utf-8
      Expires:
      - '-1'
      Pragma:
      - no-cache
      Strict-Transport-Security:
      - max-age=31536000; includeSubDomains
      X-Content-Type-Options:
      - nosniff
      X-XSS-Protection:
      - '0'
    status:
      code: 200
      message: OK
version: 1
