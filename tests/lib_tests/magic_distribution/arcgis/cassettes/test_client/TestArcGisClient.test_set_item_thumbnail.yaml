interactions:
- request:
    body: null
    headers:
      Accept:
      - '*/*'
      Accept-Encoding:
      - gzip, deflate
      Connection:
      - keep-alive
      Content-Length:
      - '0'
      User-Agent:
      - python-requests/2.34.2
    method: POST
    uri: https://www.arcgis.com/sharing/rest/content/users/x/items/x/updateThumbnail?url=https%3A%2F%2Fexample.com%2Foverview.png&f=json&token=x
  response:
    body:
      string: '{"id":"x","success":true}'
    headers:
      Cache-Control:
      - no-cache
      Connection:
      - keep-alive
      Content-Encoding:
      - gzip
      Content-Type:
      - application/json;charset=utf-8
      Expires:
      - '-1'
      Pragma:
      - no-cache
      Server:
      - ArcGIS Online
      Strict-Transport-Security:
      - max-age=31536000
      Transfer-Encoding:
      - chunked
      Vary:
      - Origin, Authorization, X-Esri-Authorization
      Via:
      - 1.1 x.cloudfront.net (CloudFront)
      X-Amz-Cf-Pop:
      - LHR95-P3
      X-Cache:
      - Miss from cloudfront
      X-Content-Type-Options:
      - nosniff
    status:
      code: 200
      message: OK

